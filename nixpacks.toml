# Dokploy / Nixpacks — Bun monorepo static site (apps/website).
# Pin nixpkgs to avoid Node 18 (EOL/removed from current nixpkgs evaluations).

[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_SPA_OUT_DIR = "apps/website/dist"

[phases.setup]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.build]
cmds = ["bun run --filter @macheseinfach/website build"]
